<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MadaCar - Nettoyage CIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#1a1a1a;color:#eee;padding:16px}
h1{font-size:20px;margin:0 0 12px}
input,button{width:100%;padding:12px;margin-bottom:8px;border-radius:8px;border:1px solid #444;font-size:15px}
input{background:#2a2a2a;color:#eee}
button{background:#eee;color:#000;font-weight:600}
button.danger{background:#b3261e;color:#fff;border-color:#b3261e}
.card{background:#2a2a2a;border-radius:10px;padding:12px;margin-bottom:10px;font-size:14px}
.muted{color:#aaa;font-size:13px}
#msg{margin:10px 0;color:#f5c542;font-size:14px}
#app{display:none}
</style>
</head>
<body>
<h1>Nettoyage des photos CIN</h1>
<div id="login">
  <input id="email" type="email" placeholder="Email admin">
  <input id="pwd" type="password" placeholder="Mot de passe">
  <button onclick="login()">Connexion</button>
</div>
<div id="app">
  <p class="muted">Vendeurs vérifiés ou refusés dont les photos CIN sont encore stockées. La suppression est définitive.</p>
  <button class="danger" id="all" onclick="delAll()">Tout supprimer</button>
  <div id="list"></div>
</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://cpdksgligvxukghiform.supabase.co',' sb_publishable_GLIcl2WMc9fmTX7Pr23Dzw_uFF_Ttp1');
let rows=[];
const msg=t=>document.getElementById('msg').textContent=t||'';

async function login(){
  msg('Connexion...');
  const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pwd.value});
  if(error){msg('Erreur : '+error.message);return}
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  msg('');load();
}

async function load(){
  const {data,error}=await sb.from('seller_verifications')
    .select('id,status,reviewed_at,cin_front_path,cin_back_path,documents_deleted_at')
    .in('status',['verified','rejected']).is('documents_deleted_at',null);
  if(error){msg('Erreur : '+error.message);return}
  rows=data||[];
  const box=document.getElementById('list');
  if(!rows.length){box.innerHTML='<div class="card">Rien à supprimer.</div>';document.getElementById('all').style.display='none';return}
  document.getElementById('all').style.display='block';
  box.innerHTML=rows.map(r=>`<div class="card">
    <div>Vendeur ${r.id.slice(0,8)} - ${r.status==='verified'?'vérifié':'refusé'}</div>
    <div class="muted">Contrôlé le ${r.reviewed_at?new Date(r.reviewed_at).toLocaleDateString('fr-FR'):'?'}</div>
    <button class="danger" style="margin-top:8px" onclick="del('${r.id}')">Supprimer les photos</button>
  </div>`).join('');
}

async function del(id){
  const r=rows.find(x=>x.id===id);if(!r)return;
  if(!confirm('Supprimer définitivement les photos CIN de ce vendeur ?'))return;
  const paths=[r.cin_front_path,r.cin_back_path].filter(Boolean);
  if(paths.length){
    const {data,error}=await sb.storage.from('cin-documents').remove(paths);
    if(error){msg('Erreur : '+error.message);return}
    if((data||[]).length<paths.length){msg('Suppression refusée (vérifie le SQL de l\'étape 1).');return}
  }
  const {error:e2}=await sb.from('seller_verifications').update({documents_deleted_at:new Date().toISOString()}).eq('id',id);
  if(e2){msg('Photos supprimées, mais la base n\'a pas été mise à jour : '+e2.message);return}
  msg('Photos supprimées.');load();
}

async function delAll(){
  if(!confirm('Supprimer les photos CIN de TOUS les vendeurs listés ?'))return;
  for(const r of [...rows]){
    const paths=[r.cin_front_path,r.cin_back_path].filter(Boolean);
    if(paths.length){
      const {data,error}=await sb.storage.from('cin-documents').remove(paths);
      if(error||(data||[]).length<paths.length){msg('Arrêt : suppression refusée.');return}
    }
    await sb.from('seller_verifications').update({documents_deleted_at:new Date().toISOString()}).eq('id',r.id);
  }
  msg('Terminé.');load();
}
</script>
</body>
</html>
