<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MadaCar - Mes annonces</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#1a1a1a;color:#eee}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#000}
nav a{color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font-size:14px}
main{padding:12px}
h1{font-size:20px;margin:6px 0 12px}
input,button{width:100%;padding:12px;margin-bottom:8px;border-radius:8px;border:1px solid #444;font-size:15px}
input{background:#2a2a2a;color:#eee}
button{background:#eee;color:#000;font-weight:600}
button.danger{background:#b3261e;color:#fff;border-color:#b3261e}
.sub{background:#2a2a2a;border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px}
.card{background:#2a2a2a;border-radius:12px;overflow:hidden;margin-bottom:12px}
.card img{width:100%;height:160px;object-fit:cover;display:block;background:#444}
.info{padding:12px}
.price{font-size:17px;font-weight:600}
.meta{color:#aaa;font-size:13px;margin-top:4px}
.st{display:inline-block;border-radius:20px;padding:3px 12px;font-size:13px;margin-top:8px;border:1px solid #777}
.st.ok{background:#1f3d26;border-color:#3f8f55}
.st.no{background:#4a1f1c;border-color:#b3261e}
.st.wait{background:#3d3517;border-color:#b8962e}
.reason{margin-top:8px;font-size:14px;color:#f3b5b0}
.warn{margin-top:8px;font-size:13px;color:#f5c542}
.empty{text-align:center;color:#aaa;padding:30px}
#msg{color:#f5c542;font-size:14px;margin:8px 0}
#app{display:none}
.rappel{background:#3d3517;border:2px solid #f5a623;border-radius:10px;padding:14px;margin-bottom:12px}
.rappel.rouge{background:#4a1f1c;border-color:#e5484d}
.rappel a{display:inline-block;margin-top:10px;padding:10px 16px;background:#f5a623;color:#000;border-radius:8px;text-decoration:none;font-weight:700}
html,body{max-width:100%;overflow-x:hidden}
main{max-width:100%;overflow-wrap:anywhere}
.card,.sub,.rappel{max-width:100%}
.card img{max-width:100%;height:150px}
.price{font-size:15px}
.info{font-size:13px}
.meta{font-size:12px}
</style>
</head>
<body>
<nav>
  <a href="annonces.html">Annonces</a>
  <a href="publier.html">Publier</a>
  <a href="abonnement.html">Abonnement</a>
  <a href="mes-annonces.html">Mes annonces</a>
</nav>
<main>
<h1>Mes annonces</h1>
<div id="login">
  <input id="email" type="email" placeholder="Email">
  <input id="pwd" type="password" placeholder="Mot de passe">
  <button onclick="login()">Connexion</button>
</div>
<div id="app">
  <div class="sub" id="sub"></div>
  <div id="rappel-abo"></div>
  <div id="list"></div>
</div>
<div id="msg"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://cpdksgligvxukghiform.supabase.co';
const sb=supabase.createClient(SUPABASE_URL,'sb_publishable_GLIcl2WMc9fmTX7Pr23Dzw_uFF_Ttp1');
let user=null,subActive=false;
const msg=t=>document.getElementById('msg').textContent=t||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photoUrl=p=>/^https?:/.test(p)?p:`${SUPABASE_URL}/storage/v1/object/public/listing-photos/${p}`;
const fmt=d=>new Date(d).toLocaleDateString('fr-FR');

async function init(){
  const {data}=await sb.auth.getSession();
  if(data.session){user=data.session.user;start()}
}
async function login(){
  msg('Connexion...');
  const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pwd.value});
  if(error){msg('Erreur : '+error.message);return}
  user=data.user;msg('');start();
}
async function start(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  await loadSub();await loadList();
}
async function loadSub(){
  const box=document.getElementById('sub');
  const rap=document.getElementById('rappel-abo');
  rap.innerHTML='';
  const {data,error}=await sb.from('subscriptions').select('plan_code,status,ends_at').eq('seller_id',user.id).order('ends_at',{ascending:false,nullsFirst:false}).limit(1);
  if(error||!data||!data.length){box.innerHTML='Aucun abonnement. <a href="abonnement.html" style="color:#fff">Choisir un forfait</a>';return}
  const s=data[0];
  subActive=s.status==='active'&&(!s.ends_at||new Date(s.ends_at)>new Date());
  box.innerHTML=subActive
    ?`Abonnement ${esc(s.plan_code)} actif jusqu'au ${s.ends_at?fmt(s.ends_at):'-'}.`
    :`Abonnement ${esc(s.plan_code)} expiré ou inactif. Tes annonces sont masquées.`;
  let texte='',rouge=false;
  if(!subActive){texte='Ton abonnement a expiré : tes annonces sont masquées aux acheteurs.';rouge=true}
  else if(s.ends_at){
    const j=Math.ceil((new Date(s.ends_at)-new Date())/86400000);
    if(j<=5)texte='Ton abonnement expire dans '+j+' jour'+(j>1?'s':'')+'.';
  }
  if(texte)rap.innerHTML=`<div class="rappel ${rouge?'rouge':''}"><div>${texte}</div><a href="abonnement.html">Renouveler mon abonnement</a></div>`;
}
async function loadSubb0ld(){
  const box=document.getElementById('sub');
  const {data,error}=await sb.from('subscriptions').select('plan_code,status,ends_at').eq('seller_id',user.id).order('ends_at',{ascending:false}).limit(1);
  if(error||!data||!data.length){box.innerHTML='Aucun abonnement. <a href="abonnement.html" style="color:#fff">Choisir un forfait</a>';return}
  const s=data[0];
  subActive=s.status==='active'&&(!s.ends_at||new Date(s.ends_at)>new Date());
  box.innerHTML=subActive
    ?`Abonnement ${esc(s.plan_code)} actif jusqu'au ${s.ends_at?fmt(s.ends_at):'-'}.`
    :`Abonnement ${esc(s.plan_code)} expiré ou inactif. Tes annonces sont masquées. <a href="abonnement.html" style="color:#fff">Renouveler</a>`;
}
async function loadList(){
  const {data,error}=await sb.from('listings').select('*').eq('seller_id',user.id).order('created_at',{ascending:false});
  const box=document.getElementById('list');
  if(error){box.innerHTML='<div class="empty">Erreur : '+esc(error.message)+'</div>';return}
  if(!data.length){box.innerHTML='<div class="empty">Aucune annonce. <a href="publier.html" style="color:#fff">Publier une annonce</a></div>';return}
  box.innerHTML=data.map(i=>{
    const ph=(i.photos||[]).map(photoUrl)[0];
    let st='';
    if(i.status==='approved')st='<span class="st ok">Acceptée</span>'+(subActive?'':'<div class="warn">Masquée : abonnement expiré.</div>');
    else if(i.status==='rejected')st='<span class="st no">Refusée</span>'+(i.rejection_reason?`<div class="reason">Motif : ${esc(i.rejection_reason)}</div>`:'');
    else st='<span class="st wait">En attente de validation</span>';
    return `<div class="card">
      ${ph?`<img src="${esc(ph)}" alt="">`:''}
      <div class="info">
        <div class="price">${Number(i.price_ar).toLocaleString('fr-FR')} Ar</div>
        <div>${esc(i.title)}</div>
        <div class="meta">Publiée le ${fmt(i.created_at)}</div>
        ${st}
        <button class="danger" style="margin-top:12px" onclick="del('${i.id}')">Supprimer</button>
      </div>
    </div>`}).join('');
}
async function del(id){
  if(!confirm('Supprimer cette annonce définitivement ?'))return;
  const {error}=await sb.from('listings').delete().eq('id',id);
  if(error){msg('Erreur : '+error.message);return}
  msg('Annonce supprimée.');loadList();
}
init();
</script>
</body>
</html>
