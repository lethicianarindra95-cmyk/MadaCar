<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu – MadaCar</title>
<style>
body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
header{background:#000;padding:20px 14px;text-align:center;border-bottom:1px solid #333}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;color:#999;font-size:14px}
main{max-width:560px;margin:auto;padding:14px}
h2{font-size:15px;color:#ccc;margin:22px 0 6px;border-bottom:1px solid #333;padding-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.it{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #222}
.pr{white-space:nowrap;font-weight:700}
.contact{display:flex;gap:8px;margin:14px 0}
.contact a{flex:1;text-align:center;padding:12px;border-radius:8px;background:#444;color:#fff;text-decoration:none}
#msg{color:#999;text-align:center;margin-top:20px}
footer{text-align:center;color:#666;font-size:12px;padding:24px}
footer a{color:#888}
</style></head><body>
<header><h1 id="name">Menu</h1><p id="sub"></p></header>
<main>
<div id="msg">Chargement...</div>
<div class="contact" id="contact"></div>
<div id="list"></div>
</main>
<footer>Menu créé avec <a href="accueil.html">MadaCar</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://cpdksgligvxukghiform.supabase.co","sb_publishable_GLIcl2WMc9fmTX7Pr23Dzw_uFF_Ttp1");
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g, " ");

(async () => {
  const id = new URLSearchParams(location.search).get("id");
  if(!id){ $("msg").textContent = "Menu introuvable."; return; }
  const { data:m, error } = await sb.from("menus").select("*").eq("id", id).maybeSingle();
  if(error || !m){ $("msg").textContent = "Menu introuvable."; return; }
  const { data:its } = await sb.from("menu_items").select("*").eq("menu_id", id).order("position");

  document.title = m.name + " – Menu";
  $("name").textContent = m.name;
  $("sub").textContent = m.city || "";
  $("msg").textContent = "";

  if(m.phone){
    let d = m.phone.replace(/\D/g, "");
    if(d.startsWith("0")) d = "261" + d.slice(1);
    const a = document.createElement("a");
    a.href = "tel:+" + d; a.textContent = "📞 Appeler";
    const w = document.createElement("a");
    w.href = "https://wa.me/" + d; w.textContent = "WhatsApp";
    $("contact").appendChild(a); $("contact").appendChild(w);
  }

  const groups = new Map();
  (its || []).forEach(it => {
    const c = it.category || "";
    if(!groups.has(c)) groups.set(c, []);
    groups.get(c).push(it);
  });
  if(!groups.size){ $("msg").textContent = "Ce menu est vide."; return; }

  groups.forEach((items, cat) => {
    if(cat){ const h = document.createElement("h2"); h.textContent = cat; $("list").appendChild(h); }
    items.forEach(it => {
      const r = document.createElement("div"); r.className = "it";
      const n = document.createElement("span"); n.textContent = it.name;
      const p = document.createElement("span"); p.className = "pr";
      p.textContent = it.price_ar == null ? "" : fmt(it.price_ar) + " Ar";
      r.appendChild(n); r.appendChild(p);
      $("list").appendChild(r);
    });
  });
})();
</script>
</body></html>
