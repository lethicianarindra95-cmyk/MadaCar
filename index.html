<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MadaCar – Devenir vendeur</title>
<style>
:root{--bg:#1c1c1e;--card:#2a2a2d;--line:#46464b;--txt:#f2f2f3;--mute:#a1a1a8;--acc:#e4e4e7;--ok:#8fd19e;--err:#ff8a80}
*{box-sizing:border-box}
html{overflow-x:hidden}
main{width:100%;min-width:0}
.box,input{max-width:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.5px}
p.sub{color:var(--mute);margin:0 0 24px}
label{display:block;margin:16px 0 6px;font-weight:600;font-size:15px}
input[type=text],input[type=tel],input[type=email],input[type=password]{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px}
input[type=file]{width:100%;padding:10px;border-radius:8px;border:1px dashed var(--line);background:var(--card);color:var(--mute)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:20px;color:var(--mute);font-size:14px}
.chk input{margin-top:4px;width:20px;height:20px;flex:none}
button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:8px;background:var(--acc);color:#111;font-size:17px;font-weight:700}
button:disabled{opacity:.5}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);margin-top:12px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#msg{margin-top:16px;min-height:22px;font-size:15px}
.err{color:var(--err)}.ok{color:var(--ok)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:8px}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;background:var(--line)}
.badge.verified{background:var(--ok);color:#111}.badge.rejected{background:var(--err);color:#111}
.hide{display:none}
</style>
</head>
<body><nav style="display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#000;position:sticky;top:0;z-index:50">
  <a href="annonces.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Annonces</a>
  <a href="publier.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Publier</a>
  <a href="abonnement.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Abonnement</a>
  <a href="index.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Inscription vendeur</a>
</nav>
<main>
<h1>MadaCar</h1>
<p class="sub">Inscription vendeur. Acheter reste gratuit, sans compte.</p>

<section id="vForm">
<form id="f" autocomplete="on">
<label for="prenom">Prénom</label><input id="prenom" type="text" required>
<label for="nom">Nom</label><input id="nom" type="text" required>
<label for="tel">Téléphone (MVola)</label><input id="tel" type="tel" inputmode="tel" placeholder="034 00 000 00" required>
<label for="email">Adresse e-mail</label><input id="email" type="email" required>
<label for="mdp">Mot de passe (6 caractères minimum)</label><input id="mdp" type="password" minlength="6" required>
<label for="cin">Numéro de CIN</label><input id="cin" type="text" inputmode="numeric" required>
<label for="recto">Photo CIN, recto</label><input id="recto" type="file" accept="image/*" required>
<label for="verso">Photo CIN, verso</label><input id="verso" type="file" accept="image/*" required>
<label for="profil">Photo de profil</label><input id="profil" type="file" accept="image/*" required>
<div class="chk"><input id="ok" type="checkbox" required><label for="ok" style="font-weight:400;margin:0">J'accepte que MadaCar utilise ma CIN uniquement pour vérifier mon identité. Seul l'administrateur y a accès, jamais les acheteurs.</label></div>
<button id="go" type="submit">Envoyer ma demande</button>
<button type="button" class="ghost" id="toLogin">J'ai déjà un compte</button>
</form>
</section>

<section id="vLogin" class="hide">
<label for="le">Adresse e-mail</label><input id="le" type="email">
<label for="lm">Mot de passe</label><input id="lm" type="password">
<button id="lgo" type="button">Me connecter</button>
<button type="button" class="ghost" id="toForm">Créer un compte vendeur</button>
</section>

<section id="vStatus" class="hide">
<div class="box">
<p style="margin:0 0 8px" id="who"></p>
<span class="badge" id="badge"></span>
<p id="stxt" style="color:var(--mute);margin:12px 0 0"></p>
</div>
<button type="button" class="ghost" id="out">Me déconnecter</button>
</section>

<div id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient("https://cpdksgligvxukghiform.supabase.co","sb_publishable_GLIcl2WMc9fmTX7Pr23Dzw_uFF_Ttp1");
const $ = id => document.getElementById(id);
const show = id => ["vForm","vLogin","vStatus"].forEach(v => $(v).classList.toggle("hide", v !== id));
const say = (t, c) => { $("msg").textContent = t; $("msg").className = c || ""; };

// Réduit la photo (≈ 1000 px, JPEG) pour économiser les données mobiles
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("Photo illisible")), "image/jpeg", 0.75);
      URL.revokeObjectURL(u);
    };
    img.onerror = () => rej(new Error("Photo illisible"));
    img.src = u;
  });
}

async function upload(bucket, uid, name, file){
  const path = uid + "/" + name + "-" + Date.now() + ".jpg";
  const { error } = await sb.storage.from(bucket).upload(path, await shrink(file), { contentType: "image/jpeg" });
  if (error) throw error;
  return path;
}

async function refresh(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show("vForm"); return; }
  const uid = session.user.id;
  const { data, error } = await sb.from("seller_verifications").select("status,rejection_reason")
    .eq("user_id", uid).order("created_at", { ascending: false }).limit(1).maybeSingle();
  if (error) { say("Erreur : " + error.message, "err"); return; }
  if (!data) { show("vForm"); say("Compte connecté, mais la demande CIN n'est pas encore envoyée. Remplis le formulaire.", "err"); return; }
  const { data: p } = await sb.from("profiles").select("first_name,last_name").eq("id", uid).maybeSingle();
  const t = { pending:["En attente","Ta demande est reçue. L'administrateur vérifie ta CIN."],
              verified:["Vendeur vérifié MadaCar","Ton identité est confirmée. Tu auras le badge sur tes annonces."],
              rejected:["Refusé","Ta demande a été refusée" + (data.rejection_reason ? " : " + data.rejection_reason : ".")] }[data.status] || [data.status, ""];
  $("who").textContent = p ? (p.first_name || "") + " " + (p.last_name || "") : "";
  $("badge").textContent = t[0]; $("badge").className = "badge " + data.status;
  $("stxt").textContent = t[1];
  show("vStatus"); say("");
}

$("f").addEventListener("submit", async e => {
  e.preventDefault(); $("go").disabled = true; say("Envoi en cours, patiente…");
  try {
    const prenom = $("prenom").value.trim(), nom = $("nom").value.trim(), tel = $("tel").value.trim();
    let { data: { session } } = await sb.auth.getSession();
    if (!session) {
      const { data, error } = await sb.auth.signUp({ email: $("email").value.trim(), password: $("mdp").value,
        options: { data: { first_name: prenom, last_name: nom, phone: tel } } });
      if (error) throw error;
      if (!data.session) throw new Error("La confirmation par e-mail est encore activée dans Supabase. Désactive-la, puis réessaie.");
      session = data.session;
    }
    const uid = session.user.id;
    const front = await upload("cin-documents", uid, "recto", $("recto").files[0]);
    const back = await upload("cin-documents", uid, "verso", $("verso").files[0]);
    const av = await upload("avatars", uid, "profil", $("profil").files[0]);
    const avatar_url = sb.storage.from("avatars").getPublicUrl(av).data.publicUrl;
    const fields = { first_name: prenom, last_name: nom, phone: tel, avatar_url };
    const u = await sb.from("profiles").update(fields).eq("id", uid).select();
    if (u.error) throw u.error;
    if (!u.data.length) { const i = await sb.from("profiles").insert({ id: uid, ...fields }); if (i.error) throw i.error; }
    const { error: e2 } = await sb.from("seller_verifications").insert({
      user_id: uid, cin_number: $("cin").value.trim(), cin_front_path: front, cin_back_path: back,
      consent_given: true, consent_at: new Date().toISOString() });
    if (e2) throw e2;
    say("Demande envoyée.", "ok"); await refresh();
  } catch (err) { say("Erreur : " + err.message, "err"); }
  $("go").disabled = false;
});

$("lgo").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("le").value.trim(), password: $("lm").value });
  if (error) say("Erreur : " + error.message, "err"); else refresh();
};
$("out").onclick = async () => { await sb.auth.signOut(); show("vLogin"); say(""); };
$("toLogin").onclick = () => { show("vLogin"); say(""); };
$("toForm").onclick = () => { show("vForm"); say(""); };
refresh();
</script>
</body>
</html>
