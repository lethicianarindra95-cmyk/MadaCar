<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MadaCar – Publier une annonce</title>
<style>
  :root { --bg:#111; --card:#1c1c1c; --line:#333; --txt:#eee; --mut:#999; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:14px; }
  h1 { font-size:20px; margin:0 0 12px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  input, textarea { width:100%; padding:11px; background:#222; border:1px solid var(--line); color:var(--txt); border-radius:8px; font-size:15px; }
  textarea { min-height:90px; }
  .two { display:flex; gap:8px; } .two > div { flex:1; }
  .btn { width:100%; padding:13px; margin-top:16px; border:0; border-radius:8px; background:#555; color:#fff; font-size:16px; }
  .btn:disabled { opacity:.5; }
  #msg { margin:10px 0; font-size:14px; color:#e6b800; }
  #prev { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  #prev img { height:70px; border-radius:6px; border:1px solid var(--line); }
  .hide { display:none; }
</style>
</head>
<body>
<h1>Publier une annonce</h1>
<div id="msg"></div>

<div id="login" class="hide">
  <label>Email</label><input id="email" type="email">
  <label>Mot de passe</label><input id="pass" type="password">
  <button class="btn" id="btnLogin">Connexion</button>
</div>

<div id="app" class="hide">
  <label>Titre *</label><input id="title" maxlength="100" placeholder="Ex : Toyota Corolla 2012">
  <div class="two">
    <div><label>Marque *</label><input id="brand"></div>
    <div><label>Modèle *</label><input id="model"></div>
  </div>
  <div class="two">
    <div><label>Année *</label><input id="year" type="number" inputmode="numeric"></div>
    <div><label>Kilométrage *</label><input id="km" type="number" inputmode="numeric"></div>
  </div>
  <label>Prix (Ar) *</label><input id="price" type="number" inputmode="numeric">
  <div class="two">
    <div><label>Ville *</label><input id="city"></div>
    <div><label>Téléphone *</label><input id="phone" type="tel"></div>
  </div>
  <label>Description</label><textarea id="desc"></textarea>
  <label>Photos (jusqu'à 5)</label>
  <input id="files" type="file" accept="image/*" multiple>
  <div id="prev"></div>
  <button class="btn" id="btnPub">Envoyer pour validation</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://cpdksgligvxukghiform.supabase.co";
const SUPABASE_KEY ="sb_publishable_GLIcl2WMc9fmTX7Pr23Dzw_uFF_Ttp1";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let me = null;
function say(t){ $("msg").textContent = t || ""; }

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("login").classList.remove("hide"); return; }
  me = session.user;
  const { data:v } = await sb.from("seller_verifications").select("status").eq("user_id", me.id).maybeSingle();
  if(!v || v.status !== "verified"){
    say("Ton compte vendeur doit d'abord être vérifié (CIN) avant de publier.");
    return;
  }
  $("login").classList.add("hide");
  $("app").classList.remove("hide");
}

$("btnLogin").onclick = async () => {
  say("Connexion...");
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pass").value });
  if(error){ say("Erreur : " + error.message); return; }
  say(""); init();
};

$("files").onchange = () => {
  const box = $("prev"); box.innerHTML = "";
  [...$("files").files].slice(0,5).forEach(f => {
    const i = document.createElement("img"); i.src = URL.createObjectURL(f); box.appendChild(i);
  });
};

// Compression : max 1280 px, JPEG qualité 0.8
function compress(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error("Photo illisible")), "image/jpeg", 0.8);
    };
    img.onerror = () => reject(new Error("Photo illisible"));
    img.src = URL.createObjectURL(file);
  });
}

$("btnPub").onclick = async () => {
  const v = id => $(id).value.trim();
  const title = v("title"), brand = v("brand"), model = v("model"), city = v("city"), phone = v("phone");
  const year = parseInt(v("year")), km = parseInt(v("km")), price = parseInt(v("price"));
  if(!title || !brand || !model || !city || !phone || !year || isNaN(km) || !price){
    say("Remplis tous les champs marqués *."); return;
  }
  const files = [...$("files").files].slice(0,5);
  if(!files.length){ say("Ajoute au moins une photo."); return; }

  $("btnPub").disabled = true;
  try{
    const paths = [];
    for(let i = 0; i < files.length; i++){
      say("Envoi de la photo " + (i+1) + "/" + files.length + "...");
      const blob = await compress(files[i]);
      const path = me.id + "/" + Date.now() + "-" + i + ".jpg";
      const { error } = await sb.storage.from("listing-photos").upload(path, blob, { contentType:"image/jpeg" });
      if(error) throw error;
      paths.push(path);
    }
    say("Enregistrement de l'annonce...");
    const { error } = await sb.from("listings").insert({
      seller_id: me.id, title, description: v("desc"), price_ar: price,
      brand, model, year, mileage_km: km, city, contact_phone: phone,
      photos: paths, source: "personal", status: "pending"
    });
    if(error) throw error;
    say("Annonce envoyée. Elle sera visible après validation par l'équipe MadaCar.");
    ["title","brand","model","year","km","price","city","phone","desc"].forEach(id => $(id).value = "");
    $("files").value = ""; $("prev").innerHTML = "";
  }catch(e){
    say(String(e.message || e).includes("row-level security")
  ? "Il faut un compte vérifié et un abonnement actif pour publier."
  : "Erreur : " + (e.message || e));
  }
  $("btnPub").disabled = false;
};

init();
</script>
</body>
</html>
