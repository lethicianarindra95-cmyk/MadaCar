<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MadaCar – Publier une annonce</title>
<style>
  :root { --bg:#111; --card:#1c1c1c; --line:#333; --txt:#eee; --mut:#999; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:14px; }
  h1 { font-size:20px; margin:0 0 12px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  input, textarea { width:100%; padding:11px; background:#222; border:1px solid var(--line); color:var(--txt); border-radius:8px; font-size:15px; }
  textarea { min-height:90px; }
  .two { display:flex; gap:8px; } .two > div { flex:1; min-width:0; }
  .btn { width:100%; padding:13px; margin-top:16px; border:0; border-radius:8px; background:#555; color:#fff; font-size:16px; }
  .btn:disabled { opacity:.5; }
  #msg { margin:10px 0; font-size:14px; color:#e6b800; }
  #plan { margin:8px 0; padding:10px 12px; background:#1c1c1c; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  #prev { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  #prev img { height:70px; border-radius:6px; border:1px solid var(--line); }
  .hide { display:none; }
</style>
</head>
<body><nav style="display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#000;position:sticky;top:0;z-index:50">
  <a href="annonces.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Annonces</a>
  <a href="publier.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Publier</a>
  <a href="abonnement.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Abonnement</a><a href="mes-annonces.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Mes annonces</a>
  <a href="index.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Inscription vendeur</a>
</nav>
<h1>Publier une annonce</h1>
<div id="msg"></div>

<div id="login" class="hide">
  <label>Email</label><input id="email" type="email">
  <label>Mot de passe</label><input id="pass" type="password">
  <button class="btn" id="btnLogin">Connexion</button>
</div>

<div id="app" class="hide">
  <div id="plan"></div>
  <label>Titre *</label><input id="title" maxlength="100" placeholder="Ex : Toyota Corolla 2012">
  <div class="two">
    <div><label>Marque *</label><input id="brand"></div>
    <div><label>Modèle *</label><input id="model"></div>
  </div>
  <div class="two">
    <div><label>Année *</label><input id="year" type="number" inputmode="numeric"></div>
    <div><label>Kilométrage *</label><input id="km" type="number" inputmode="numeric"></div>
  </div>
  <label>Prix (Ar) *</label><input id="price" type="number" inputmode="numeric">
  <div class="two">
    <div><label>Ville *</label><input id="city"></div>
    <div><label>Téléphone *</label><input id="phone" type="tel"></div>
  </div>
  <label>Description</label><textarea id="desc"></textarea>
  <label id="lblPhotos">Photos</label>
  <input id="files" type="file" accept="image/*" multiple>
  <div id="prev"></div>
  <button class="btn" id="btnPub">Envoyer pour validation</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://cpdksgligvxukghiform.supabase.co";
const SUPABASE_KEY ="sb_publishable_GLIcl2WMc9fmTX7Pr23Dzw_uFF_Ttp1";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let me = null;
let planCode = "basic";
let maxAds = 3, maxPhotos = 3;
let activeAds = 0;
function say(t){ $("msg").textContent = t || ""; }

const LIMITS = {
  vip:     { name:"VIP",     ads:1000, photos:10 },
  premium: { name:"Premium", ads:10,   photos:6 },
  basic:   { name:"Basique", ads:3,    photos:3 }
};

async function countAds(){
  const { count } = await sb.from("listings")
    .select("id", { count:"exact", head:true })
    .eq("seller_id", me.id).in("status", ["pending","approved"]);
  return count || 0;
}

async function loadPlan(){
  const { data } = await sb.from("seller_plan").select("plan_code").eq("seller_id", me.id).maybeSingle();
  planCode = (data && LIMITS[data.plan_code]) ? data.plan_code : "basic";
  maxAds = LIMITS[planCode].ads;
  maxPhotos = LIMITS[planCode].photos;
  activeAds = await countAds();
  const ads = maxAds >= 1000 ? activeAds + " annonce(s) active(s), sans limite" : activeAds + "/" + maxAds + " annonces actives";
  $("plan").textContent = "Forfait " + LIMITS[planCode].name + " : " + ads + ", jusqu'à " + maxPhotos + " photos par annonce.";
  $("lblPhotos").textContent = "Photos (jusqu'à " + maxPhotos + ")";
}

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("login").classList.remove("hide"); return; }
  me = session.user;
  const { data:v } = await sb.from("seller_verifications").select("status").eq("user_id", me.id).maybeSingle();
  if(!v || v.status !== "verified"){
    say("Ce compte n'est pas un vendeur vérifié. Connecte-toi avec un compte vendeur vérifié.");
    await sb.auth.signOut();
    $("login").classList.remove("hide");
    return;
  }
  await loadPlan();
  $("login").classList.add("hide");
  $("app").classList.remove("hide");
}

$("btnLogin").onclick = async () => {
  say("Connexion...");
  const { error } = await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pass").value });
  if(error){ say("Erreur : " + error.message); return; }
  say(""); init();
};

$("files").onchange = () => {
  const box = $("prev"); box.innerHTML = "";
  let files = [...$("files").files];
  if(files.length > maxPhotos){
    say("Ton forfait " + LIMITS[planCode].name + " permet " + maxPhotos + " photo(s) par annonce. Choisis-en " + maxPhotos + " maximum.");
    $("files").value = "";
    return;
  }
  say("");
  files.forEach(f => {
    const i = document.createElement("img"); i.src = URL.createObjectURL(f); box.appendChild(i);
  });
};

// Compression : max 1280 px, JPEG qualité 0.8
function compress(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error("Photo illisible")), "image/jpeg", 0.8);
    };
    img.onerror = () => reject(new Error("Photo illisible"));
    img.src = URL.createObjectURL(file);
  });
}

$("btnPub").onclick = async () => {
  const v = id => $(id).value.trim();
  const title = v("title"), brand = v("brand"), model = v("model"), city = v("city"), phone = v("phone");
  const year = parseInt(v("year")), km = parseInt(v("km")), price = parseInt(v("price"));
  if(!title || !brand || !model || !city || !phone || !year || isNaN(km) || !price){
    say("Remplis tous les champs marqués *."); return;
  }
  const files = [...$("files").files];
  if(!files.length){ say("Ajoute au moins une photo."); return; }
  if(files.length > maxPhotos){
    say("Ton forfait " + LIMITS[planCode].name + " permet " + maxPhotos + " photo(s) par annonce."); return;
  }

  $("btnPub").disabled = true;
  try{
    activeAds = await countAds();
    if(activeAds >= maxAds){
      say("Limite atteinte : ton forfait " + LIMITS[planCode].name + " permet " + maxAds + " annonce(s) active(s). Supprime une annonce ou passe à un forfait supérieur.");
      $("btnPub").disabled = false;
      return;
    }
    const paths = [];
    for(let i = 0; i < files.length; i++){
      say("Envoi de la photo " + (i+1) + "/" + files.length + "...");
      const blob = await compress(files[i]);
      const path = me.id + "/" + Date.now() + "-" + i + ".jpg";
      const { error } = await sb.storage.from("listing-photos").upload(path, blob, { contentType:"image/jpeg" });
      if(error) throw error;
      paths.push(path);
    }
    say("Enregistrement de l'annonce...");
    const { error } = await sb.from("listings").insert({
      seller_id: me.id, title, description: v("desc"), price_ar: price,
      brand, model, year, mileage_km: km, city, contact_phone: phone,
      photos: paths, source: "personal", status: "pending"
    });
    if(error) throw error;
    ["title","brand","model","year","km","price","city","phone","desc"].forEach(id => $(id).value = "");
    $("files").value = ""; $("prev").innerHTML = "";
    await loadPlan();
    say("Annonce envoyée. Elle sera visible après validation par l'équipe MadaCar.");
  }catch(e){
    say(String(e.message || e).includes("row-level security")
  ? "Il faut un compte vérifié et un abonnement actif pour publier."
  : "Erreur : " + (e.message || e));
  }
  $("btnPub").disabled = false;
};

init();
</script>
</body>
</html>
