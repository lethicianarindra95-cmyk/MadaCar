<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MadaCar – Annonces</title>
<style>
  :root { --bg:#111; --card:#1c1c1c; --line:#333; --txt:#eee; --mut:#999; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:14px; }
  h1 { font-size:22px; margin:0 0 12px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; }
  .bar input { min-width:0; padding:11px; background:#222; border:1px solid var(--line); color:var(--txt); border-radius:8px; font-size:15px; }
  #q { flex:2; } #max { flex:1; }
  #msg { color:#e6b800; font-size:14px; margin:8px 0; }
  .grid { display:grid; grid-template-columns:1fr; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card img { width:100%; height:190px; object-fit:cover; display:block; background:#222; }
  .info { padding:10px 12px 12px; }
  .info h3 { margin:0 0 4px; font-size:16px; }
  .price { font-weight:700; margin-bottom:4px; }
  .meta { color:var(--mut); font-size:13px; }
  .badge { display:inline-block; margin-top:6px; font-size:12px; padding:3px 8px; border-radius:10px; background:#333; }
  #detail { position:fixed; inset:0; background:var(--bg); overflow-y:auto; padding:14px; }
  .hide { display:none; }
  .back { background:#333; color:#fff; border:0; padding:10px 14px; border-radius:8px; font-size:14px; margin-bottom:12px; }
  .photos { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; }
  .photos img { height:240px; border-radius:8px; border:1px solid var(--line); }
  .desc { white-space:pre-wrap; margin:10px 0; font-size:15px; }
  .row { display:flex; gap:8px; margin-top:14px; }
  .row a { flex:1; text-align:center; padding:13px; border-radius:8px; color:#fff; text-decoration:none; font-size:15px; }
  .call { background:#555; } .wa { background:#1f9d55; }
</style>
</head>
<body><nav style="display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#000;position:sticky;top:0;z-index:50">
  <a href="annonces.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Annonces</a>
  <a href="publier.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Publier</a>
  <a href="abonnement.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Abonnement</a>
  <a href="index.html" style="color:#fff;text-decoration:none;padding:8px 14px;border:1px solid #555;border-radius:20px;white-space:nowrap;font:14px system-ui,sans-serif">Inscription vendeur</a>
</nav>
<h1>Annonces MadaCar</h1>
<div class="bar">
  <input id="q" placeholder="Marque, modèle, ville...">
  <input id="max" type="number" inputmode="numeric" placeholder="Prix max (Ar)">
</div>
<div id="msg"></div>
<div id="list" class="grid"></div>
<div id="detail" class="hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://cpdksgligvxukghiform.supabase.co";
const SUPABASE_KEY = "sb_publishable_GLIcl2WMc9fmTX7Pr23Dzw_uFF_Ttp1 ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let all = [];

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function ar(n){ return Number(n).toLocaleString("fr-FR") + " Ar"; }
function photoUrl(p){
  if(!p) return null;
  if(/^https?:\/\//.test(p)) return p;
  return sb.storage.from("listing-photos").getPublicUrl(p).data.publicUrl;
}
function waNumber(phone){
  let d = String(phone || "").replace(/\D/g, "");
  if(d.startsWith("00")) d = d.slice(2);
  if(d.startsWith("0")) d = "261" + d.slice(1);
  return d;
}

async function load(){
  $("msg").textContent = "Chargement...";
  const { data, error } = await sb.from("listings")
    .select("id,title,description,price_ar,brand,model,year,mileage_km,city,contact_phone,photos,source,source_url,created_at")
    .eq("status", "approved").order("created_at", { ascending:false }).limit(60);
  if(error){ $("msg").textContent = "Erreur : " + error.message; return; }
  all = data; render();
}

function render(){
  const q = $("q").value.trim().toLowerCase();
  const max = parseInt($("max").value);
  const rows = all.filter(l => {
    const txt = [l.title, l.brand, l.model, l.city].join(" ").toLowerCase();
    return (!q || txt.includes(q)) && (!max || Number(l.price_ar) <= max);
  });
  $("msg").textContent = rows.length ? "" : "Aucune annonce trouvée.";
  const list = $("list"); list.innerHTML = "";
  rows.forEach(l => list.appendChild(card(l)));
}

function card(l){
  const c = el("div","card");
  const u = photoUrl((l.photos || [])[0]);
  if(u){ const i = document.createElement("img"); i.src = u; i.loading = "lazy"; i.alt = l.title; c.appendChild(i); }
  const info = el("div","info");
  info.appendChild(el("h3","", l.title));
  info.appendChild(el("div","price", ar(l.price_ar)));
  info.appendChild(el("div","meta", [l.year, l.mileage_km != null ? Number(l.mileage_km).toLocaleString("fr-FR") + " km" : null, l.city].filter(Boolean).join(" · ")));
  if(l.source === "personal") info.appendChild(el("div","badge","✔ Vendeur vérifié MadaCar"));
  c.appendChild(info);
  c.onclick = () => openDetail(l);
  return c;
}

function openDetail(l){
  const d = $("detail"); d.innerHTML = "";
  const back = el("button","back","← Retour");
  back.onclick = () => { d.classList.add("hide"); };
  d.appendChild(back);
  const ph = el("div","photos");
  (l.photos || []).forEach(p => { const u = photoUrl(p); if(u){ const i = document.createElement("img"); i.src = u; i.loading = "lazy"; ph.appendChild(i); } });
  d.appendChild(ph);
  d.appendChild(el("h2","", l.title));
  d.appendChild(el("div","price", ar(l.price_ar)));
  d.appendChild(el("div","meta", [l.brand, l.model, l.year, l.mileage_km != null ? Number(l.mileage_km).toLocaleString("fr-FR") + " km" : null, l.city].filter(Boolean).join(" · ")));
  if(l.source === "personal") d.appendChild(el("div","badge","✔ Vendeur vérifié MadaCar"));
  if(l.description) d.appendChild(el("div","desc", l.description));
  if(l.contact_phone){
    const row = el("div","row");
    const call = el("a","call","Appeler"); call.href = "tel:" + l.contact_phone.replace(/[^\d+]/g, "");
    const wa = el("a","wa","WhatsApp");
    wa.href = "https://wa.me/" + waNumber(l.contact_phone) + "?text=" + encodeURIComponent("Bonjour, je suis intéressé par votre annonce MadaCar : " + l.title);
    wa.target = "_blank"; wa.rel = "noopener";
    row.appendChild(call); row.appendChild(wa);
    d.appendChild(row);
  }
  d.classList.remove("hide");
  d.scrollTop = 0;
}

$("q").oninput = render;
$("max").oninput = render;
load();
</script>
</body>
</html>
